<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authenticating...</title>
</head>
<body>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        if (code) {
            localStorage.setItem('oauth_code', code);
            // Notify the parent window if it exists (Popup mode)
            if (window.opener) {
                window.opener.postMessage({ type: 'oauth_complete', code: code }, window.location.origin);
                window.close();
            } else {
                // Fallback for redirect mode
                window.location.replace("index.html");
            }
        } else {
            document.body.innerHTML = "<h1>Authentication failed: No code received.</h1>";
            setTimeout(() => window.close(), 3000);
        }
    </script>
</body>
</html>
