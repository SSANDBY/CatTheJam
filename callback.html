<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CatTheJam — 42 Girişi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0d0f;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
    }
    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 48px 56px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .logo { font-size: 3rem; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
    .subtitle {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 32px;
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 1rem;
    }
    .spinner {
      width: 20px; height: 20px;
      border: 3px solid #2a2a4a;
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success { color: #4ade80; font-size: 1.5rem; }
    .error   { color: #f87171; font-size: 1.5rem; }
    #message { margin-top: 8px; font-size: 0.85rem; color: #aaa; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🐱</div>
    <h1>CatTheJam</h1>
    <p class="subtitle">42 Network ile giriş yapılıyor</p>

    <div class="status" id="status">
      <div class="spinner" id="spinner"></div>
      <span id="statusText">Doğrulanıyor...</span>
    </div>
    <p id="message"></p>
  </div>

  <script>
    const params  = new URLSearchParams(window.location.search);
    const code    = params.get('code');
    const error   = params.get('error');

    const spinner    = document.getElementById('spinner');
    const statusText = document.getElementById('statusText');
    const message    = document.getElementById('message');

    if (error) {
      spinner.style.display = 'none';
      statusText.textContent = '✗  Giriş iptal edildi';
      statusText.className   = 'error';
      message.textContent    = error;

    } else if (code) {
      statusText.textContent = '✓  Giriş başarılı!';
      spinner.style.display  = 'none';
      statusText.className   = 'success';
      message.textContent    = 'Oyuna yönlendiriliyorsunuz...';

      // Kodu Godot'un local sunucusuna ilet
      // Godot, localhost:8080'i TCPServer ile dinliyor
      fetch('http://localhost:8080/?code=' + encodeURIComponent(code))
        .catch(() => {
          // fetch CORS hatası verebilir ama Godot kodu GET request'ten okur,
          // o yüzden Image trick ile de dene (CORS-free):
          new Image().src = 'http://localhost:8080/?code=' + encodeURIComponent(code);
        });

    } else {
      spinner.style.display = 'none';
      statusText.textContent = '⚠  Geçersiz istek';
      message.textContent    = 'Kod parametresi bulunamadı.';
    }
  </script>
</body>
</html>
